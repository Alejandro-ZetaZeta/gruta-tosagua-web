[auth]
allowed_redirect_urls = ["http://localhost:4321/api/auth/google/callback", "http://127.0.0.1:4321/api/auth/google/callback"]
# Requiere SMTP configurado; la app ya tiene la pantalla de código.
require_email_verification = true
verify_email_method = "code"
reset_password_method = "code"
disable_signup = false

[auth.password]
min_length = 12
require_number = true
require_lowercase = true
require_uppercase = true
require_special_char = true

[auth.smtp]
enabled = true
host = "smtp.gmail.com"
port = 587
username = "tosaguagruta@gmail.com"
sender_email = "tosaguagruta@gmail.com"
sender_name = "Gruta correos"
min_interval_seconds = 60

[storage]
max_file_size_mb = 50

[realtime]
retention_days = 0

[schedules]
retention_days = 7
